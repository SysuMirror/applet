  /admin/v1/overview:
    get:
      tags: [Admin]
      summary: 平台概览与待审队列
      security: [{ adminCookie: [] }]
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      apps: { type: integer }
                      published: { type: integer }
                      reviewing: { type: integer }
                      developers: { type: integer }
                      events24h: { type: integer }
                      notifications24h: { type: integer }
                      launches24h: { type: integer }
                      openFeedback: { type: integer }
                  pending:
                    type: array
                    items:
                      type: object
                      properties:
                        appKey: { type: string }
                        name: { type: string }
                        icon: { type: string }
                        category: { type: string }
                        developerId: { type: integer }
                        versionId: { type: [integer, 'null'] }
                        version: { type: string }
                        changelog: { type: string }
                        submittedAt: { type: string, format: date-time }
  /admin/v1/apps:
    get:
      tags: [Admin]
      summary: 全部小程序（游标分页 / 搜索 / 状态筛选）
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, reviewing, approved, rejected, published, offline] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DevApp' } }
                  nextCursor: { type: [string, 'null'] }
    post:
      tags: [Admin]
      summary: 新建官方小程序（直接发布）
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateApp'
                - type: object
                  required: [name, entryURL]
                  properties:
                    sort: { type: integer }
                    status: { type: string, enum: [published] }
      responses:
        '201': { description: 已创建 }
  /admin/v1/apps/{appKey}:
    get:
      tags: [Admin]
      summary: 小程序详情（含版本、统计）
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      responses:
        '200': { description: 详情 }
    patch:
      tags: [Admin]
      summary: 更新小程序
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateApp' } } }
      responses:
        '200': { description: 已更新 }
  /admin/v1/apps/{appKey}/approve:
    post:
      tags: [Admin]
      summary: 审核通过
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId: { type: integer }
                note: { type: string }
      responses:
        '200': { description: 已通过 }
        '409': { $ref: '#/components/responses/Error' }
  /admin/v1/apps/{appKey}/reject:
    post:
      tags: [Admin]
      summary: 驳回
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                versionId: { type: integer }
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        '200': { description: 已驳回 }
        '409': { $ref: '#/components/responses/Error' }
  /admin/v1/apps/{appKey}/publish:
    post:
      tags: [Admin]
      summary: 发布版本
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { versionId: { type: integer } }
      responses:
        '200': { description: 已发布 }
  /admin/v1/apps/{appKey}/unpublish:
    post:
      tags: [Admin]
      summary: 强制下架
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      responses:
        '200': { description: 已下架 }
  /admin/v1/apps/{appKey}/allowlist:
    put:
      tags: [Admin]
      summary: 设置白名单 visible=allowlist
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/AppKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties: { userIds: { type: array, items: { type: string } } }
      responses:
        '200':
          description: 已更新
          content: { application/json: { schema: { type: object, properties: { userIds: { type: array, items: { type: string } } } } } }
  /admin/v1/developers:
    get:
      tags: [Admin]
      summary: 开发者列表
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Developer'
                        - type: object
                          properties:
                            orgName: { type: string }
                            phone: { type: string }
                            status: { type: string, enum: [active, suspended] }
                            emailVerified: { type: boolean }
                            appCount: { type: integer }
                            lastLoginAt: { type: [string, 'null'], format: date-time }
  /admin/v1/developers/{id}:
    patch:
      tags: [Admin]
      summary: 停用 / 启用开发者
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [active, suspended] } }
      responses:
        '200': { description: 已更新 }
        '409': { $ref: '#/components/responses/Error' }
  /admin/v1/audit-logs:
    get:
      tags: [Admin]
      summary: 审计日志（游标分页）
      security: [{ adminCookie: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 审计
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
                  nextCursor: { type: [string, 'null'] }
  /admin/v1/events:
    get:
      tags: [Admin]
      summary: 内部事件列表
      security: [{ adminCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 事件
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        eventId: { type: string }
                        type: { type: string }
                        dedupKey: { type: string }
                        payload: { type: object }
                        status: { type: string }
                        receivedAt: { type: string, format: date-time }
                        processedAt: { type: [string, 'null'], format: date-time }
                        error: { type: [string, 'null'] }
                  nextCursor: { type: [string, 'null'] }
  /admin/v1/feedback:
    get:
      tags: [Admin]
      summary: 用户反馈
      security: [{ adminCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
      responses:
        '200':
          description: 反馈
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        userId: { type: string }
                        appKey: { type: string }
                        content: { type: string }
                        contact: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
  /admin/v1/feedback/{id}:
    patch:
      tags: [Admin]
      summary: 处理反馈
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [open, resolved] } }
      responses:
        '200': { description: 已更新 }

  # ── 统一身份登录（UniSSO） ──────────────────────────────────────────────
  /auth/sso/status:
    get:
      tags: [SSO]
      summary: SSO 可用状态
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  enabled: { type: boolean }
                  m2m: { type: boolean }
                  loginUrl: { type: string }
  /auth/sso/start:
    get:
      tags: [SSO]
      summary: 开始授权跳转（已有共享会话时直接建立本地登录）
      parameters:
        - { name: next, in: query, schema: { type: string }, description: 登录后回跳路径，只允许站内 / 开头 }
      responses:
        '302': { description: 跳转到 SSO 或回跳 next }
  /callback:
    get:
      tags: [SSO]
      summary: SSO 回调（授权码 + PKCE）
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 建立 mp_dev 会话后回跳 }
  /auth/sso/m2m:
    post:
      tags: [SSO]
      summary: 邮箱密码无感登录（需要平台开通内接应用 M2M）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: 已登录并 Set-Cookie mp_dev }
        '403': { $ref: '#/components/responses/Error' }
  /auth/sso/logout:
    post:
      tags: [SSO]
      summary: 注销 SSO 共享会话
      responses:
        '200':
          description: 已注销
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } }
  /auth/sso/verify:
    post:
      tags: [SSO]
      summary: App 用 SSO access_token 换平台 Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accessToken: { type: string }
                token: { type: string, description: accessToken 的别名 }
      responses:
        '200':
          description: 平台 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: Bearer }
                  expiresIn: { type: integer }
                  user:
                    type: object
                    properties:
                      userId: { type: string }
                      name: { type: string }
                      email: { type: string }
                      avatar: { type: string }
                      sseSub: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  # ── 内部接口（主站 outbox） ─────────────────────────────────────────────
  /internal/v1/events/new-post:
    post:
      tags: [Internal]
      summary: 新帖事件推送（HMAC 签名）
      parameters: [{ $ref: '#/components/parameters/InternalSignature' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventID, title]
              properties:
                eventID: { type: string }
                postID: { type: integer }
                title: { type: string }
                partition: { type: string }
                authorUserID: { type: integer }
                createdAt: { type: string, format: date-time }
                dedupKey: { type: string }
      responses:
        '202': { description: 已接收并开始分发 }
        '200': { description: 重复事件（已去重） }
  /internal/v1/token/verify:
    post:
      tags: [Internal]
      summary: 主站 Token 校验（HMAC 签名）
      parameters: [{ $ref: '#/components/parameters/InternalSignature' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string } }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  userID: { type: string }
                  expiresAt: { type: string }

  # ── 第三方小程序服务端 ──────────────────────────────────────────────────
  /app/v1/apps/self:
    get:
      tags: [AppServer]
      summary: 当前小程序信息（HMAC 签名）
      parameters: [{ $ref: '#/components/parameters/AppSignature' }]
      responses:
        '200':
          description: 小程序
          content: { application/json: { schema: { type: object, properties: { app: { $ref: '#/components/schemas/PublicApp' } } } } }
  /app/v1/apps/me:
    get:
      tags: [AppServer]
      summary: 当前小程序完整配置（HMAC 签名，含开发者视角字段）
      parameters: [{ $ref: '#/components/parameters/AppSignature' }]
      responses:
        '200':
          description: 小程序
          content: { application/json: { schema: { type: object, properties: { app: { $ref: '#/components/schemas/DevApp' } } } } }
  /app/v1/sessions/verify:
    post:
      tags: [AppServer]
      summary: 校验小程序会话（HMAC 签名）
      parameters: [{ $ref: '#/components/parameters/AppSignature' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionToken: { type: string }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  userId: { type: string }
                  appKey: { type: string }
                  scopes: { type: array, items: { type: string } }
                  deviceId: { type: string }
                  expiresAt: { type: string }

  # ── 运维 ────────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Ops]
      summary: 进程健康检查
      responses:
        '200': { description: 进程存活 }
  /readyz:
    get:
      tags: [Ops]
      summary: 就绪检查（MySQL 可用）
      responses:
        '200': { description: '{"ok":true,"db":"up"}' }
        '503': { description: 数据库不可用 }
  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus 指标（可配 MP_METRICS_TOKEN 要求 Bearer）
      security: [{ metricsToken: [] }, {}]
      responses:
        '200':
          description: 指标文本
          content: { text/plain: { schema: { type: string } } }

components:
  securitySchemes:
    mainToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 主站 / UniSSO access token（平台只验签，不保存 refresh token）
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
    devCookie:
      type: apiKey
      in: cookie
      name: mp_dev
    adminCookie:
      type: apiKey
      in: cookie
      name: mp_dev
    metricsToken:
      type: http
      scheme: bearer

  parameters:
    AppKey:
      name: appKey
      in: path
      required: true
      schema: { type: string }
    InternalSignature:
      name: X-Internal-Signature
      in: header
      required: true
      description: 另需 X-Internal-Timestamp / X-Internal-Nonce
      schema: { type: string }
    AppSignature:
      name: X-App-Signature
      in: header
      required: true
      description: 另需 X-App-Key / X-App-Timestamp / X-App-Nonce
      schema: { type: string }

  responses:
    Error:
      description: 统一错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 触发限流（带 Retry-After）
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Audio:
      description: 音频数据
      content:
        audio/*: { schema: { type: string, format: binary } }
        application/json: { schema: { type: object } }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    PublicApp:
      type: object
      properties:
        appKey: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string, description: 'tabler:* 图标名，或图片图标的绝对 URL（/media/... 由 API 转换为 https://<平台>/media/...）' }
        category: { type: string }
        entryURL: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
        allowedOrigins: { type: array, items: { type: string } }
        visibility: { type: string, enum: [public, logged_in, allowlist] }
        version: { type: string }
        ownerType: { type: string, enum: [official, partner] }
        sort: { type: integer }
        badge: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
    DevApp:
      allOf:
        - $ref: '#/components/schemas/PublicApp'
        - type: object
          properties:
            id: { type: integer }
            developerId: { type: [integer, 'null'] }
            status: { type: string, enum: [draft, reviewing, approved, rejected, published, offline] }
            requestedScopes: { type: array, items: { type: string } }
            pinyin: { type: string }
            keywords: { type: string }
            webhookUrl: { type: string }
            rejectReason: { type: string }
            hostingMode: { type: string, enum: [internal, external] }
            hostingBuild: { type: string }
            hostingUpdatedAt: { type: [string, 'null'], format: date-time }
            hostedAt: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deletedAt: { type: [string, 'null'], format: date-time }
            secretMasked: { type: string }
    DevAppDetail:
      allOf:
        - $ref: '#/components/schemas/DevApp'
        - type: object
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/Version' } }
            allowlist: { type: array, items: { type: string } }
    Version:
      type: object
      properties:
        id: { type: integer }
        appId: { type: integer }
        version: { type: string }
        entryURL: { type: string, format: uri }
        allowedOrigins: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        changelog: { type: string }
        status: { type: string, enum: [draft, reviewing, approved, rejected, published, superseded] }
        rejectReason: { type: string }
        submittedAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Developer:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [developer, admin] }
        avatarUrl: { type: string }
        authSource: { type: string }
        authSourceLabel: { type: string }
    Session:
      type: object
      properties:
        userId: { type: string }
        appKey: { type: string }
        deviceId: { type: string }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    Prefs:
      type: object
      properties:
        recent:
          type: array
          items:
            type: object
            properties:
              appKey: { type: string }
              openedAt: { type: string, format: date-time }
              app: { $ref: '#/components/schemas/PublicApp' }
        favorites:
          type: array
          items:
            type: object
            properties:
              appKey: { type: string }
              addedAt: { type: string, format: date-time }
              app: { $ref: '#/components/schemas/PublicApp' }
        limits:
          type: object
          properties:
            recent: { type: integer }
            favorites: { type: integer }
    Subscriptions:
      type: object
      properties:
        topics:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              enabled: { type: boolean }
              quietHours:
                type: [object, 'null']
                properties:
                  from: { type: string }
                  to: { type: string }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        appKey: { type: string }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Device:
      type: object
      properties:
        deviceID: { type: string }
        platform: { type: string, enum: [android, ohos, windows, ios, web] }
        appVersion: { type: string }
        pushProvider: { type: string, enum: [fcm, hms, apns, wns, local] }
        pushToken: { type: string, description: 掩码后的 token }
        notificationEnabled: { type: boolean }
        locale: { type: string }
        lastSeenAt: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        actorType: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetKey: { type: string }
        before: { type: [object, 'null'] }
        after: { type: [object, 'null'] }
        ip: { type: string }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    CreateApp:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 32 }
        appKey: { type: string, pattern: '^[a-z][a-z0-9_-]{2,31}$' }
        category: { type: string }
        description: { type: string, maxLength: 200 }
        icon: { type: string }
        entryURL: { type: string, format: uri }
        allowedOrigins: { type: array, items: { type: string, format: uri } }
        scopes:
          type: array
          items: { type: string, enum: [profile:read, prefs:read, prefs:write, notifications:read, notifications:write, posts:read] }
        visibility: { type: string, enum: [public, logged_in, allowlist] }
        webhookUrl: { type: string, format: uri }
        keywords: { type: string, maxLength: 200 }
        sort: { type: integer }
        ownerType: { type: string, enum: [official, partner] }