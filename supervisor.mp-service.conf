; 参考片段：请通过 YatTerra 平台维护的 ~/deploy/supervisord.conf 注册，
; 不要直接覆盖平台文件。
[program:mp-service]
command=/home/cloud/deploy/mp-service/deploy.sh
directory=/home/cloud/deploy/mp-service
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/cloud/logs/mp-service.out.log
stderr_logfile=/home/cloud/logs/mp-service.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
